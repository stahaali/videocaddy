<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a1a1a"/>
  <rect x="0" y="200" width="400" height="100" fill="url(#storyGrad)"/>
